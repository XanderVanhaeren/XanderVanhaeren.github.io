<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xander Vanhaeren — Engineering Student & Aerospace Portfolio</title>
    <meta name="description" content="Portfolio of Xander Vanhaeren, engineering student at KU Leuven focused on aerospace: aerodynamics, flight dynamics, CAD, embedded systems and RC aircraft projects.">
    <meta name="author" content="Xander Vanhaeren">
    <meta name="theme-color" content="#1b1b1b">
    <script>
        try {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.documentElement.style.colorScheme = savedTheme;
                var metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) metaTheme.setAttribute('content', savedTheme === 'light' ? '#f5f7fa' : '#1b1b1b');
            }
        } catch (e) {}
    </script>
    <link rel="canonical" href="https://xandervanhaeren.github.io/">

    <!-- Social previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Xander Vanhaeren — Engineering Portfolio">
    <meta property="og:description" content="Engineering student at KU Leuven. Aerodynamics, flight dynamics, CAD and embedded systems projects.">
    <meta property="og:url" content="https://xandervanhaeren.github.io/">
    <meta property="og:image" content="https://xandervanhaeren.github.io/assets/images/projects/Typhoon/typhoon-v3.jpg">

    <link rel="icon" href="/assets/Logo/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
